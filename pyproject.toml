[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisearch"
version = "0.1.0"
description = "A cost-based multimodal hybrid (keyword + vector) retrieval engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
models = [
    "torch>=2.4",
    "open_clip_torch>=2.24",
    "transformers>=4.44",
    "openai-whisper>=20240930",
]
bench = ["matplotlib>=3.8", "faiss-cpu>=1.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
omnisearch = "omnisearch.cli:main"

[tool.setuptools.packages.find]
include = ["omnisearch*"]

[tool.setuptools.package-data]
"omnisearch.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
